name: Test VK Reviews
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch VK Reviews
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python fetch_vk_reviews.py
