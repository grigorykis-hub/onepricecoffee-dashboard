name: Обновление дашборда

on:
  schedule:
    # Ежедневно в 11:00 МСК = 8:00 UTC (VK, TG, выручка)
    - cron: '0 8 * * *'
    # Еженедельно по воскресеньям в 10:00 МСК = 7:00 UTC (+ Яндекс отзывы)
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      update_yandex:
        description: 'Обновить отзывы Яндекс (да/нет)'
        required: false
        default: 'нет'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Запустить скрипт обновления (VK, TG, выручка, VK-отзывы)
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python update_dashboard.py

      - name: Установить Playwright (только воскресенье или ручной запрос)
        if: |
          github.event.schedule == '0 7 * * 0' ||
          github.event.inputs.update_yandex == 'да'
        run: |
          pip install playwright
          playwright install firefox --with-deps

      - name: Обновить отзывы Яндекс Карт
        if: |
          github.event.schedule == '0 7 * * 0' ||
          github.event.inputs.update_yandex == 'да'
        run: python fetch_yandex_reviews.py

      - name: Зафиксировать и опубликовать изменения
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"

          if git diff --quiet index.html; then
            echo "Изменений нет — пропускаем коммит"
          else
            SUMMARY=$(cat update_summary.txt 2>/dev/null || echo "Авто-обновление")
            DATE=$(date '+%d.%m.%Y')
            git add index.html
            git commit -m "Авто-обновление ${DATE}: ${SUMMARY}"
            git push
            echo "Изменения запушены"
          fi
